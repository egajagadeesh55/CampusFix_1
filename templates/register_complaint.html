<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Register Complaint - CampusFix</title>
</head>

<body>

    <div class="navbar">
        <div class="brand">
            CampusFix <span>|</span> Student Portal
        </div>

        <div class="student-nav">
            <span class="scholar-id">
                Scholar No: {{ session['scholar_number'] }}
            </span>

            <a href="/student/dashboard" class="logout-btn">
                Dashboard
            </a>
        </div>
    </div>

    <div class="card">

        <h3>Register a Maintenance Complaint</h3>

        <form method="POST" enctype="multipart/form-data">

            <div class="form-grid">

                <div class="form-group">
                    <label>Student Name</label>
                    <input
                        type="text"
                        name="student_name"
                        placeholder="Enter your name"
                        required>
                </div>

                <div class="form-group">
                    <label>Department / Branch</label>

                    <select name="department" required>
                        <option value="">Select Branch</option>
                        <option value="Computer Science">
                            Computer Science & Engineering
                        </option>
                        <option value="Information Technology">
                            Information Technology
                        </option>
                        <option value="Mechanical">
                            Mechanical Engineering
                        </option>
                        <option value="Civil">
                            Civil Engineering
                        </option>
                        <option value="Electrical">
                            Electrical Engineering
                        </option>
                        <option value="Electronics">
                            Electronics & Communication
                        </option>
                        <option value="BCA">BCA</option>
                        <option value="MCA">MCA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Building</label>

                    <select name="building" required>
                        <option value="Block A">Block A</option>
                        <option value="Block B">Block B</option>
                        <option value="Block C">Block C</option>
                        <option value="Block F">Block F</option>
                        <option value="Administrative Block">Administrative Block</option>
                        <option value="Library">Library</option>
                        <option value="Computer Lab">Computer Lab</option>
                        <option value="Hostel Block">Hostel Block</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Room No.</label>
                    <input
                        type="text"
                        name="room_no"
                        placeholder="e.g. 204"
                        required>
                </div>

                <div class="form-group">
                    <label>Category</label>

                    <select name="category" required>
                        <option value="Electrical">
                            Electrical (Fan, Light, Switch, Socket)
                        </option>
                        <option value="Furniture">
                            Furniture (Desk, Chair, Podium, Board)
                        </option>
                        <option value="Plumbing">
                            Plumbing (Tap, Leakage, Washroom, Pipe)
                        </option>
                        <option value="IT">
                            IT Infrastructure (PC, Projector, LAN, Mouse)
                        </option>
                        <option value="Internet">
                            Internet / Wi-Fi Access
                        </option>
                        <option value="Cleaning">
                            Cleaning & Sanitation
                        </option>
                        <option value="AC/Cooling">
                            AC / Water Cooler
                        </option>
                        <option value="Other">
                            Other Campus Facilities
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Priority</label>

                    <select name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

            </div>

            <div class="form-group" style="margin-top:10px;">
                <label>Problem Description</label>

                <textarea
                    name="description"
                    rows="5"
                    placeholder="Describe the problem..."
                    required></textarea>
            </div>

            <div class="form-group" style="margin-top:10px;">
                <label>Attach Photo Proof (Optional)</label>

                <input
                    type="file"
                    name="photo"
                    accept="image/*">
            </div>

            <button type="submit">
                Submit Complaint
            </button>

        </form>

    </div>
<script>
    const fileInput = document.querySelector('input[type="file"]');
    if (fileInput) {
      fileInput.addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith('image/')) return;

        // Skip small images already under 500 KB
        if (file.size < 500 * 1024) return;

        const reader = new FileReader();
        reader.onload = function (event) {
          const img = new Image();
          img.onload = function () {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1024;
            const MAX_HEIGHT = 1024;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob(
              function (blob) {
                const compressedFile = new File([blob], file.name, {
                  type: 'image/jpeg',
                  lastModified: Date.now(),
                });
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(compressedFile);
                fileInput.files = dataTransfer.files;
              },
              'image/jpeg',
              0.7
            );
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    </script>
</body>
</html>
